name: Publicar site

# Gera os dados estáticos a partir do Tesouro Transparente e publica a página
# no GitHub Pages. Nada é commitado no repositório: os dados vão direto no
# artefato do Pages, então o histórico do Git não cresce com o tempo.
#
# O CSV não vem do portal: desde outubro de 2026 ele devolve um desafio em
# JavaScript a qualquer script. Ele é baixado no navegador e sobe como anexo
# do release `fonte` — pelo scripts/publicar_dados.ps1 no notebook ou por um
# atalho no celular (LEIA-ME-PAGES.md) —, e quem envia também dispara este
# workflow. Por isso não há agendamento: sem CSV novo, não há o que publicar.
#
# O celular não consegue substituir um anexo de mesmo nome, então cada envio
# dele tem nome próprio. Vale o anexo mais novo; os anteriores são apagados
# depois que a publicação dá certo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # apagar os anexos antigos do release fonte
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet pandas requests bizdays python-dateutil numpy

      - name: Baixar o CSV mais novo do release fonte
        id: fonte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/fonte" --jq '
            [.assets[] | select(.name | test("^precotaxatesourodireto.*[.]csv$"))]
            | sort_by(.created_at) | last | "\(.id) \(.created_at) \(.name)"' > escolhido.txt
          read -r id criado nome < escolhido.txt
          if [ -z "$id" ] || [ "$id" = "null" ]; then echo "Nenhum CSV no release fonte"; exit 1; fi
          echo "Usando $nome, enviado em $criado"
          mkdir -p entrada
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$id" > entrada/precotaxatesourodireto.csv
          ls -l entrada
          echo "criado=$criado" >> "$GITHUB_OUTPUT"

      # Do celular pode subir qualquer arquivo — inclusive a página de desafio
      # do portal, se o download falhou. Melhor parar aqui que publicar lixo.
      - name: Conferir o CSV
        run: |
          set -euo pipefail
          esperado="Tipo Titulo;Data Vencimento;Data Base;Taxa Compra Manha;Taxa Venda Manha;PU Compra Manha;PU Venda Manha;PU Base Manha"
          primeira=$(head -n 1 entrada/precotaxatesourodireto.csv | sed 's/^\xEF\xBB\xBF//' | tr -d '\r')
          if [ "$primeira" != "$esperado" ]; then echo "Cabeçalho inesperado: $primeira"; exit 1; fi
          tamanho=$(stat -c %s entrada/precotaxatesourodireto.csv)
          if [ "$tamanho" -lt 5242880 ]; then echo "Arquivo pequeno demais: $tamanho bytes"; exit 1; fi
          echo "Cabeçalho confere; $tamanho bytes."

      - name: Gerar os dados do site
        run: python scripts/gerar_dados_site.py site --arquivo entrada/precotaxatesourodireto.csv

      - name: Conferir que o site está completo
        run: |
          set -euo pipefail
          for f in site/index.html site/dados/meta.json site/dados/papeis.json \
                   site/dados/feriados.json site/dados/indices.json \
                   site/dados/ultimo_dia.csv; do
            test -s "$f" || { echo "Faltou $f"; exit 1; }
          done
          echo "Papéis gerados: $(ls site/dados/p | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Apagar os anexos anteriores ao publicado
        env:
          GH_TOKEN: ${{ github.token }}
          CRIADO: ${{ steps.fonte.outputs.criado }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/fonte" --jq '
            .assets[] | select(.created_at < env.CRIADO) | "\(.id) \(.name)"' |
          while read -r id nome; do
            echo "Apagando $nome"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done

      - name: Resumo
        run: |
          {
            echo "### Site publicado"
            echo ""
            echo "- Data base mais recente: **$(cat ultima_data.txt)**"
            echo "- Papéis: $(ls site/dados/p | wc -l)"
            echo "- Tamanho dos dados: $(du -sh site/dados | cut -f1)"
            echo "- Endereço: ${{ steps.deploy.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
